version: 1
name: feature
description: Provider-independent agentic delivery workflow for feature work.

execution_defaults:
  timeout: 60m
  max_attempts: 1
  retry_on: []
  backoff: 0s

orchestrator:
  executor: claude
  purpose: Own workflow state, synthesize specialist findings, enforce the plan gate, and verify completion.
  mcps: [atlassian, codex-delegate]
  optional_mcps: [github]

roles:
  orchestration:
    executor: claude
    purpose: Produce exactly one orchestrator-owned workflow stage artifact from prior run artifacts and repository evidence. Do not advance workflow state; the deterministic engine owns transitions.
    read_only: true
    optional_mcps: [atlassian, context7, github]

  docs:
    executor: claude
    claude_subagent: docs-researcher
    purpose: Resolve current, version-specific external library/framework documentation before decisions depend on an API, SDK, migration, configuration, or deprecation.
    read_only: true
    artifact: 05-analysis/docs-researcher.md
    artifact_schema: subagent-findings
    mcps: [context7]

  architect:
    executor: claude
    claude_subagent: mobile-architect
    purpose: Inspect architecture, integration points, reuse opportunities, boundaries, and trade-offs.
    read_only: true
    artifact: 05-analysis/mobile-architect.md
    artifact_schema: subagent-findings
    optional_mcps: [context7]

  architecture-assessment:
    executor: claude
    purpose: Build an evidence-backed current-state architecture assessment for a whole-app refactor, covering business drivers, constraints, quality attributes, team ownership, delivery/operations, security/compliance, data/integrations, testing, migration constraints, risks, unknowns, and weighted decision criteria.
    read_only: true
    artifact: 05-architecture-assessment.md
    artifact_schema: architecture-assessment
    optional_mcps: [context7, github]

  architecture-options:
    executor: claude
    purpose: Propose 2-4 viable target architectures from repository evidence and the architecture assessment. Explain trade-offs, migration/reversibility, team/operations/security/performance/testability impact, score every option against the same decision criteria, provide C4 previews, and make an advisory recommendation without selecting on behalf of the human.
    read_only: true
    artifact: 05-architecture-options.md
    artifact_schema: architecture-options
    optional_mcps: [context7, github]

  target-architecture:
    executor: claude
    purpose: Convert the human-selected architecture option into a concrete architecture contract with boundaries, dependency rules, module responsibilities, data ownership, integration contracts, security/observability/testing requirements, performance budgets, migration guardrails, and executable architecture fitness functions.
    read_only: true
    artifact: 05-target-architecture.md
    artifact_schema: target-architecture
    optional_mcps: [context7, github]

  c4-model:
    executor: claude
    purpose: Model the selected target architecture with C4. Always produce System Context and Container views; add Component views for important/high-risk containers and Dynamic/Deployment views when useful. Include version-controlled Structurizr DSL as the source model; do not invent code-level detail unsupported by repository evidence.
    read_only: true
    artifact: 05-c4-model.md
    artifact_schema: c4-model
    optional_mcps: [context7, github]

  architecture-migration:
    executor: claude
    purpose: Decompose the selected architecture into risk-aware domains and dependency-ordered migration waves with integration checkpoints, rollback points, behavior coverage, and whole-app completion criteria.
    read_only: true
    artifact: 05-architecture-migration.md
    artifact_schema: architecture-migration
    optional_mcps: [context7, github]

  architecture-compliance-review:
    executor: claude
    purpose: Independently compare the final implementation against the human-selected target architecture, dependency rules, C4 model, migration guardrails, and architecture fitness functions. Report violations as review findings; do not approve architecture by assumption.
    read_only: true
    artifact: 09-reviews/architecture-compliance-reviewer.md
    artifact_schema: review
    optional_mcps: [context7, github]

  security:
    executor: claude
    claude_subagent: security-analyst
    purpose: Threat-model auth, session, storage, PII, permissions, deep links, WebViews, native dependencies, and external effects.
    read_only: true
    artifact: 05-analysis/security-reviewer.md
    artifact_schema: subagent-findings
    optional_mcps: [context7]

  qa-plan:
    executor: claude
    claude_subagent: qa-engineer
    purpose: Derive test cases from acceptance criteria, including negative cases and regression coverage.
    read_only: true
    artifact: 05-analysis/qa-engineer.md
    artifact_schema: subagent-findings
    optional_mcps: [atlassian]

  performance:
    executor: claude
    claude_subagent: performance-analyst
    purpose: Review rendering, startup, networking, caching, memory, concurrency, and build/runtime performance risks.
    read_only: true
    artifact: 05-analysis/performance-reviewer.md
    artifact_schema: subagent-findings
    optional_mcps: [context7]

  android:
    executor: claude
    claude_subagent: android-expert
    purpose: Review Android-specific behavior, lifecycle, permissions, native modules, performance, and Play policy impact.
    read_only: true
    artifact: 05-analysis/android-expert.md
    artifact_schema: subagent-findings
    optional_mcps: [context7, appium]

  ios:
    executor: claude
    claude_subagent: ios-expert
    purpose: Review iOS-specific behavior, lifecycle, permissions, native modules, performance, and App Store impact.
    read_only: true
    artifact: 05-analysis/ios-expert.md
    artifact_schema: subagent-findings
    optional_mcps: [context7, appium]

  flutter:
    executor: claude
    claude_subagent: flutter-expert
    purpose: Review Flutter/Dart architecture, widgets, state and navigation, pub dependencies, localization, platform channels/plugins, flavors, testing, performance, and Android/iOS integration impact.
    read_only: true
    artifact: 05-analysis/flutter-expert.md
    artifact_schema: subagent-findings
    optional_mcps: [context7, appium]

  backend:
    executor: claude
    claude_subagent: backend-expert
    purpose: Review server, API contracts, persistence, queues, migrations, concurrency, reliability, and observability.
    read_only: true
    artifact: 05-analysis/backend-expert.md
    artifact_schema: subagent-findings
    optional_mcps: [context7]

  frontend:
    executor: claude
    claude_subagent: frontend-expert
    purpose: Review web UI architecture, routing, accessibility, forms, state, data fetching, and browser behavior.
    read_only: true
    artifact: 05-analysis/frontend-expert.md
    artifact_schema: subagent-findings
    optional_mcps: [context7, playwright]

  react-native:
    executor: claude
    claude_subagent: react-native-expert
    purpose: Review React Native/Expo architecture, Hermes/New Architecture, native integration, navigation, rendering, startup, memory, dependencies and Android/iOS impact.
    read_only: true
    artifact: 05-analysis/react-native-expert.md
    artifact_schema: subagent-findings
    optional_mcps: [context7, appium]

  api-contract:
    executor: claude
    claude_subagent: api-contract-reviewer
    purpose: Review cross-stack API compatibility, schemas, nullability, errors, pagination, auth, idempotency, versioning and backward compatibility.
    read_only: true
    artifact: 05-analysis/api-contract-reviewer.md
    artifact_schema: subagent-findings
    optional_mcps: [context7]

  dependency-migration:
    executor: claude
    claude_subagent: dependency-migration-agent
    purpose: Analyze framework, SDK and dependency upgrades using repository versions and current documentation, including breaking changes, native/build impact, validation and rollback risk.
    read_only: true
    artifact: 05-analysis/dependency-migration-agent.md
    artifact_schema: subagent-findings
    mcps: [context7]

  implementation:
    executor: codex
    fallback: [claude]
    execution:
      timeout: 45m
      max_attempts: 2
      retry_on: [timeout, transient, unavailable]
      backoff: 2s
    purpose: Implement only the approved plan, keep changes minimal, and add/update tests required by the plan.
    read_only: false
    artifact: 07-implementation.md
    optional_mcps: [context7]

  qa-execute:
    executor: claude
    claude_subagent: qa-engineer
    execution:
      timeout: 30m
      max_attempts: 2
      retry_on: [timeout, transient]
      backoff: 2s
    purpose: Run the verification commands and report exact pass/fail evidence without changing product behavior to make tests pass.
    read_only: true
    artifact: 08-build-test.md
    artifact_schema: build-test
    optional_mcps: [playwright, appium]

  code-review:
    executor: claude
    claude_subagent: code-reviewer
    purpose: Independently review the diff for correctness, maintainability, regressions, and plan/acceptance-criteria compliance.
    read_only: true
    artifact: 09-reviews/code-reviewer.md
    artifact_schema: review
    optional_mcps: [context7, github]

  security-review:
    executor: claude
    claude_subagent: security-reviewer
    purpose: Independently review the final diff for security regressions, credential handling, authorization, data exposure, and unsafe external effects.
    read_only: true
    artifact: 09-reviews/security-reviewer.md
    artifact_schema: review
    optional_mcps: [context7, github]

  performance-review:
    executor: claude
    claude_subagent: performance-reviewer
    purpose: Independently review the final diff for measurable or likely performance regressions.
    read_only: true
    artifact: 09-reviews/performance-reviewer.md
    artifact_schema: review

  react-native-review:
    executor: claude
    claude_subagent: react-native-reviewer
    purpose: Independently review the final React Native/native diff and build evidence for stack-specific regressions.
    read_only: true
    artifact: 09-reviews/react-native-reviewer.md
    artifact_schema: review

  android-review:
    executor: claude
    claude_subagent: android-reviewer
    purpose: Independently review the final Android diff and build evidence.
    read_only: true
    artifact: 09-reviews/android-reviewer.md
    artifact_schema: review

  ios-review:
    executor: claude
    claude_subagent: ios-reviewer
    purpose: Independently review the final iOS diff and build evidence.
    read_only: true
    artifact: 09-reviews/ios-reviewer.md
    artifact_schema: review

  flutter-review:
    executor: claude
    claude_subagent: flutter-reviewer
    purpose: Independently review the final Flutter diff and Android/iOS integration evidence.
    read_only: true
    artifact: 09-reviews/flutter-reviewer.md
    artifact_schema: review

  frontend-review:
    executor: claude
    claude_subagent: frontend-reviewer
    purpose: Independently review the final frontend diff and browser/test evidence.
    read_only: true
    artifact: 09-reviews/frontend-reviewer.md
    artifact_schema: review

  backend-review:
    executor: claude
    claude_subagent: backend-reviewer
    purpose: Independently review the final backend diff and test evidence.
    read_only: true
    artifact: 09-reviews/backend-reviewer.md
    artifact_schema: review

  api-contract-review:
    executor: claude
    claude_subagent: api-contract-post-reviewer
    purpose: Independently review final cross-stack API/schema compatibility.
    read_only: true
    artifact: 09-reviews/api-contract-post-reviewer.md
    artifact_schema: review

  behavior-regression-review:
    executor: claude
    claude_subagent: behavior-regression-reviewer
    purpose: Independently compare the original behavior baseline and preservation invariants with the final diff/test evidence, focusing only on externally observable behavior changes.
    read_only: true
    artifact: 09-reviews/behavior-regression-reviewer.md
    artifact_schema: review

  behavior-equivalence:
    executor: claude
    claude_subagent: behavior-equivalence-verifier
    purpose: Produce the final structured behavior-equivalence verdict from the frozen baseline, invariants, final diff, tests, reviews, fixes and verification evidence.
    read_only: true
    artifact: 10-behavior-equivalence.md
    artifact_schema: behavior-equivalence

  fixes:
    executor: codex
    fallback: [claude]
    execution:
      timeout: 45m
      max_attempts: 2
      retry_on: [timeout, transient, unavailable]
      backoff: 2s
    purpose: Fix only validated review findings, preserve the approved scope, and update tests when needed.
    read_only: false
    artifact: 10-fixes.md
    optional_mcps: [context7]

  mobile-evidence:
    executor: claude
    claude_subagent: qa-engineer
    execution:
      timeout: 30m
      max_attempts: 2
      retry_on: [timeout, transient]
      backoff: 2s
    purpose: After implementation, reviews, and fixes are complete, run the finished native, React Native, or Flutter mobile/UI feature with Appium in headless evidence mode and capture final screenshots mapped to acceptance criteria.
    read_only: true
    artifact: device/mobile-device-qc.md
    optional_mcps: [appium]

stages:
  - id: request
    owner: orchestrator
    artifact: 00-request.md

  - id: requirements
    owner: orchestrator
    needs: [request]
    artifact: 01-requirements.md

  - id: acceptance-criteria
    owner: orchestrator
    needs: [requirements]
    artifact: 02-acceptance-criteria.md
    artifact_schema: acceptance-criteria

  - id: definition-of-done
    owner: orchestrator
    needs: [acceptance-criteria]
    artifact: 03-definition-of-done.md

  - id: inspection
    owner: orchestrator
    needs: [definition-of-done]
    artifact: 04-inspection.md

  - id: behavior-baseline
    owner: orchestrator
    needs: [inspection]
    when: behavior_preserving_refactor
    artifact: 04-behavior-baseline.md
    artifact_schema: behavior-baseline

  - id: refactor-invariants
    owner: orchestrator
    needs: [behavior-baseline]
    when: behavior_preserving_refactor
    artifact: 04-refactor-invariants.md
    artifact_schema: refactor-invariants

  - id: architecture-assessment
    role: architecture-assessment
    needs: [refactor-invariants]
    when: whole_app_refactor

  - id: architecture-options
    role: architecture-options
    needs: [architecture-assessment]
    when: whole_app_refactor

  - id: architecture-selection
    type: human_gate
    needs: [architecture-options]
    when: whole_app_refactor
    marker: architecture.selected

  - id: target-architecture
    role: target-architecture
    needs: [architecture-selection]
    when: whole_app_refactor

  - id: c4-model
    role: c4-model
    needs: [target-architecture]
    when: whole_app_refactor

  - id: architecture-migration
    role: architecture-migration
    needs: [c4-model]
    when: whole_app_refactor

  - id: refactor-coverage
    needs: [architecture-migration]
    when: behavior_preserving_refactor

  - id: analysis
    strategy: parallel
    needs: [refactor-coverage]
    roles: [docs, architect, qa-plan, security, performance, react-native, android, ios, flutter, backend, frontend, api-contract, dependency-migration]
    selective: true

  - id: plan
    owner: orchestrator
    needs: [analysis]
    artifact: 06-plan.md
    artifact_schema: plan

  - id: approval
    type: human_gate
    needs: [plan]
    marker: plan.approved

  - id: implementation
    role: implementation
    needs: [approval]

  - id: build-test
    role: qa-execute
    needs: [implementation]

  - id: reviews
    strategy: parallel
    needs: [build-test]
    roles: [code-review, security-review, performance-review]
    selectable_roles: [react-native-review, android-review, ios-review, flutter-review, frontend-review, backend-review, api-contract-review, behavior-regression-review]

  - id: fixes
    role: fixes
    needs: [reviews]

  - id: architecture-compliance
    role: architecture-compliance-review
    needs: [fixes]
    when: whole_app_refactor

  - id: behavior-equivalence
    role: behavior-equivalence
    needs: [architecture-compliance]
    when: behavior_preserving_refactor

  - id: verification
    owner: orchestrator
    needs: [behavior-equivalence]
    artifact: 11-verification.md
    artifact_schema: verification
    conditional_role: mobile-evidence
    condition: mobile_or_ui_feature
