version: 1
name: feature
description: Provider-independent agentic delivery workflow for feature work.

# The workflow owns the process. Executors are selected from ai/agents.yaml.
# A role may prefer one executor and list fallbacks. Adding another provider
# later only requires an entry in ai/agents.yaml plus a role mapping here.
# claude_subagent is an optimization for Claude Code; other orchestrators can
# execute the same role through ai/workflow/router.js.
# Artifact names follow the subagent names (05-analysis/<subagent>.md, 09-reviews/<subagent>.md),
# the convention ai/tasks/feature/cases.yaml and ai/README.md § 14 already use.
# mcps/optional_mcps are least-privilege capability hints; do not load every
# MCP into every role just because the project has it configured.

orchestrator:
  executor: claude
  purpose: Own workflow state, synthesize specialist findings, enforce the plan gate, and verify completion.
  mcps: [atlassian, codex-delegate]
  optional_mcps: [github]

roles:
  docs:
    executor: claude
    claude_subagent: docs-researcher
    purpose: Resolve current, version-specific external library/framework documentation before decisions depend on an API, SDK, migration, configuration, or deprecation.
    read_only: true
    artifact: 05-analysis/docs-researcher.md
    mcps: [context7]

  architect:
    executor: claude
    claude_subagent: mobile-architect
    purpose: Inspect architecture, integration points, reuse opportunities, boundaries, and trade-offs.
    read_only: true
    artifact: 05-analysis/mobile-architect.md
    optional_mcps: [context7]

  security:
    executor: claude
    claude_subagent: security-reviewer
    purpose: Threat-model auth, session, storage, PII, permissions, deep links, WebViews, native dependencies, and external effects.
    read_only: true
    artifact: 05-analysis/security-reviewer.md
    optional_mcps: [context7]

  qa-plan:
    executor: claude
    claude_subagent: qa-engineer
    purpose: Derive test cases from acceptance criteria, including negative cases and regression coverage.
    read_only: true
    artifact: 05-analysis/qa-engineer.md
    optional_mcps: [atlassian]

  performance:
    executor: claude
    claude_subagent: performance-reviewer
    purpose: Review rendering, startup, networking, caching, memory, concurrency, and build/runtime performance risks.
    read_only: true
    artifact: 05-analysis/performance-reviewer.md
    optional_mcps: [context7]

  android:
    executor: claude
    claude_subagent: android-expert
    purpose: Review Android-specific behavior, lifecycle, permissions, native modules, performance, and Play policy impact.
    read_only: true
    artifact: 05-analysis/android-expert.md
    optional_mcps: [context7, appium]

  ios:
    executor: claude
    claude_subagent: ios-expert
    purpose: Review iOS-specific behavior, lifecycle, permissions, native modules, performance, and App Store impact.
    read_only: true
    artifact: 05-analysis/ios-expert.md
    optional_mcps: [context7, appium]

  flutter:
    executor: claude
    claude_subagent: flutter-expert
    purpose: Review Flutter/Dart architecture, widgets, state and navigation, pub dependencies, localization, platform channels/plugins, flavors, testing, performance, and Android/iOS integration impact.
    read_only: true
    artifact: 05-analysis/flutter-expert.md
    optional_mcps: [context7, appium]

  backend:
    executor: claude
    claude_subagent: backend-expert
    purpose: Review server, API contracts, persistence, queues, migrations, concurrency, reliability, and observability.
    read_only: true
    artifact: 05-analysis/backend-expert.md
    optional_mcps: [context7]

  frontend:
    executor: claude
    claude_subagent: frontend-expert
    purpose: Review web UI architecture, routing, accessibility, forms, state, data fetching, and browser behavior.
    read_only: true
    artifact: 05-analysis/frontend-expert.md
    optional_mcps: [context7, playwright]

  implementation:
    executor: codex
    fallback: [claude]
    purpose: Implement only the approved plan, keep changes minimal, and add/update tests required by the plan.
    read_only: false
    artifact: 07-implementation.md
    optional_mcps: [context7]

  qa-execute:
    executor: claude
    claude_subagent: qa-engineer
    purpose: Run the verification commands and report exact pass/fail evidence without changing product behavior to make tests pass.
    read_only: true
    artifact: 08-build-test.md
    optional_mcps: [playwright, appium]

  code-review:
    executor: claude
    claude_subagent: code-reviewer
    purpose: Independently review the diff for correctness, maintainability, regressions, and plan/acceptance-criteria compliance.
    read_only: true
    artifact: 09-reviews/code-reviewer.md
    optional_mcps: [context7, github]

  security-review:
    executor: claude
    claude_subagent: security-reviewer
    purpose: Independently review the final diff for security regressions, credential handling, authorization, data exposure, and unsafe external effects.
    read_only: true
    artifact: 09-reviews/security-reviewer.md
    optional_mcps: [context7, github]

  performance-review:
    executor: claude
    claude_subagent: performance-reviewer
    purpose: Independently review the final diff for measurable or likely performance regressions.
    read_only: true
    artifact: 09-reviews/performance-reviewer.md

  fixes:
    executor: codex
    fallback: [claude]
    purpose: Fix only validated review findings, preserve the approved scope, and update tests when needed.
    read_only: false
    artifact: 10-fixes.md
    optional_mcps: [context7]

  mobile-evidence:
    executor: claude
    claude_subagent: qa-engineer
    purpose: After implementation, reviews, and fixes are complete, run the finished native, React Native, or Flutter mobile/UI feature with Appium in headless evidence mode and capture final screenshots mapped to acceptance criteria.
    read_only: true
    artifact: device/mobile-device-qc.md
    optional_mcps: [appium]

stages:
  - id: request
    owner: orchestrator
    artifact: 00-request.md

  - id: requirements
    owner: orchestrator
    needs: [request]
    artifact: 01-requirements.md

  - id: acceptance-criteria
    owner: orchestrator
    needs: [requirements]
    artifact: 02-acceptance-criteria.md

  - id: definition-of-done
    owner: orchestrator
    needs: [acceptance-criteria]
    artifact: 03-definition-of-done.md

  - id: inspection
    owner: orchestrator
    needs: [definition-of-done]
    artifact: 04-inspection.md

  - id: analysis
    strategy: parallel
    needs: [inspection]
    roles: [docs, architect, qa-plan, security, performance, android, ios, flutter, backend, frontend]
    selective: true

  - id: plan
    owner: orchestrator
    needs: [analysis]
    artifact: 06-plan.md

  - id: approval
    type: human_gate
    needs: [plan]
    marker: plan.approved

  - id: implementation
    role: implementation
    needs: [approval]

  - id: build-test
    role: qa-execute
    needs: [implementation]

  - id: reviews
    strategy: parallel
    needs: [build-test]
    roles: [code-review, security-review, performance-review]

  - id: fixes
    role: fixes
    needs: [reviews]

  - id: verification
    owner: orchestrator
    needs: [fixes]
    artifact: 11-verification.md
    conditional_role: mobile-evidence
    condition: mobile_or_ui_feature
