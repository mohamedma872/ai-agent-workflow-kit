# =============================================================================
#  <name> — THE EXAM, in plain words. One entry per case. Start with 3–5 real
#  cases, grow to 25–30. Cover both directions: cases where the task MUST act
#  and cases where it must NOT.
#
#  kind:  seeded  = these outcomes MUST be produced
#         clean   = NONE of the known signatures may be produced (phantoms = 0)
#         replay  = grade artifacts that already exist (free, offline)
#  expected[].any_of: groups of keywords; an output matches when EVERY word of
#         ANY group appears (case-insensitive) — adapter.js matches() decides.
#  mutation: {type: revert, sha: <fix commit>} re-seeds a fixed defect for the run,
#            or {type: edit, file, find, replace} for a text edit.
#  source: where the truth comes from — human-verified, never a model's output.
# =============================================================================

- id: seed-<defect>
  kind: seeded
  target: <what the entry point receives, e.g. TICKET-123>
  expect_verdict: FAIL
  tags: [core, seeded]
  mutation: {type: revert, sha: <fix commit sha>}
  source: "human-verified: found on <date>, fixed in <PR>"
  expected:
    - id: <defect-id>
      severity: red
      any_of:
        - [keyword a, keyword b]
        - [alternative phrasing]

- id: clean-<known-good>
  kind: clean
  target: <a known-good input>
  expect_verdict: PASS
  tags: [core, negative]
  source: "both-directions coverage: a known-good input must stay good; none of the seeded signatures may appear"
  expected: []

- id: replay-<existing-run>
  kind: replay
  target: <same target>
  run_dir: <path to an existing run dir>
  expect_verdict: FAIL
  tags: [replay]
  source: "offline: grades artifacts that already exist — costs nothing, validates the grader (oracle 1.0 / null 0)"
  expected:
    - id: <defect-id>
      severity: red
      any_of:
        - [keyword a]
