# <name> — the exam. One task per entry. Start with 3–5 real ones, grow to 25–30.
# Always include tasks where the agent must act AND tasks where it must not.
#
#   name                 short id
#   ask                  what to tell the agent
#   may_change           files it may touch (globs). [] = it must change nothing
#   diff_must_contain    words that must appear in the diff ("a + b" = both words; a list = any one of them)
#   answer_must_contain  words that must appear in the agent's final reply
#   must_not_contain     regexes that must appear nowhere (diff or answer)
#   check                shell commands that must pass afterwards
#   undo_fix             optional: a commit to revert for the run, to re-seed a bug that is already fixed
#   why                  where the truth comes from — a real ticket or a human check, never a model's own output
#
# For agents that write findings/reports instead of code, use:
#   must_report          [{ name, severity?, any_of: ["a + b", …] }]
#   expect_verdict       PASS / FAIL / BLOCKED
# For workflows that leave artifacts: artifacts_must_exist [files] · artifacts_must_contain [{ file, text }]

- name: fix-something-real
  ask: >-
    <what to tell the agent — the way a user would ask, without the answer in the prompt>
  may_change:
    - src/<file that should change>
  diff_must_contain:
    - <a word the fix must contain>
  check:
    - <a command that must pass, e.g. yarn jest <pattern>>
  undo_fix: <sha of the merged fix>
  why: "human-verified: found on <date>, fixed in <PR>"

- name: answer-a-question
  ask: >-
    <a question about the code> Reply with the answer only. Do not create or modify any file.
  may_change: []
  answer_must_contain: [<the expected answer>]
  why: "an agent that edits when asked a question fails"
