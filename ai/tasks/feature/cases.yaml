# feature — the exam for the /feature workflow (Claude Code).
# The grader reads the run folder ai/runs/<id>/ (copied next to the trial), the diff, and the reply.
#
#   name · ask · may_change ([] = must change nothing) · check · why      (same as the coding exam)
#   artifacts_must_exist     files the workflow must have written in its run folder
#   artifacts_must_contain   { file, text } — the text must appear in that file (text may be a list = any of)

- name: plan-only-example
  ask: >-
    A "remember me" option on the login screen that keeps the session for 30 days.
    plan-only
  may_change: []
  artifacts_must_exist:
    - 01-requirements.md
    - 02-acceptance-criteria.md
    - 03-definition-of-done.md
    - 04-inspection.md
    - 06-plan.md
    - 05-analysis/mobile-architect.md
    - 05-analysis/security-reviewer.md
  artifacts_must_contain:
    - file: 02-acceptance-criteria.md
      text: AC-1
    - file: 06-plan.md
      text: remember
  why: "workflow contract: plan-only must produce every pre-implementation artifact and change no product file"

- name: small-change-example
  ask: >-
    Add a line "Built with the AI guardrails + evals kit" to the end of README.md.
    Keep it minimal.
  may_change: [README.md]
  diff_must_contain: [README.md]
  artifacts_must_exist:
    - 02-acceptance-criteria.md
    - 03-definition-of-done.md
    - 06-plan.md
    - 07-implementation.md
    - 08-build-test.md
    - 09-reviews/security-reviewer.md
    - 09-reviews/code-reviewer.md
    - 11-verification.md
  artifacts_must_contain:
    - file: 11-verification.md
      text: AC-1
  why: "workflow contract on a trivial change; replace with a real small feature from your repo"
