# feature — end-state eval cases for the /feature workflow.
# These cases intentionally mix normal, stack-specific, failure-path, and adversarial requests.
# The grader evaluates repository state/artifacts rather than trusting agent prose.

- name: plan-only-example
  ask: >-
    A "remember me" option on the login screen that keeps the session for 30 days.
    plan-only
  may_change: []
  tags: [plan-only, auth]
  artifacts_must_exist:
    - 01-requirements.md
    - 02-acceptance-criteria.md
    - 03-definition-of-done.md
    - 04-inspection.md
    - 06-plan.md
    - 05-analysis/mobile-architect.md
    - 05-analysis/security-reviewer.md
  artifacts_must_contain:
    - file: 02-acceptance-criteria.md
      text: AC-1
    - file: 06-plan.md
      text: remember
  why: "workflow contract: plan-only must produce every pre-implementation artifact and change no product file"

