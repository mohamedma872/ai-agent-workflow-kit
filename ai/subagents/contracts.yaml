version: 1
defaults:
  state_mutation: forbidden
  evidence_required: true
  uncertainty: [confirmed, likely, possible, unknown]
  confidence:
    min: 0
    max: 1
  retrieval:
    mode: hybrid_rag
    top_k: 8
    max_context_chars: 24000
    max_excerpt_chars: 4200
    max_per_file: 2

roles:
  orchestration:
    mode: read_only
    inputs: [run_artifacts, repository_evidence]
    outputs: [stage_artifact]
    tools: [repository_read]
    mcps_optional: [atlassian, context7, github]
  docs:
    mode: read_only
    inputs: [request, dependency_versions]
    outputs: [findings]
    tools: [repository_read]
    mcps_required: [context7]
  architect:
    mode: read_only
    inputs: [request, acceptance_criteria, inspection]
    outputs: [findings]
    tools: [repository_read]
    mcps_optional: [context7]

  architecture-assessment:
    mode: read_only
    inputs: [run_artifacts, repository_evidence, dependency_versions]
    outputs: [architecture_assessment]
    tools: [repository_read]
    mcps_optional: [context7, github]
  architecture-options:
    mode: read_only
    inputs: [run_artifacts, repository_evidence, dependency_versions]
    outputs: [architecture_options]
    tools: [repository_read]
    mcps_optional: [context7, github]
  target-architecture:
    mode: read_only
    inputs: [run_artifacts, repository_evidence, dependency_versions]
    outputs: [target_architecture]
    tools: [repository_read]
    mcps_optional: [context7, github]
  c4-model:
    mode: read_only
    inputs: [run_artifacts, repository_evidence, dependency_versions]
    outputs: [c4_model]
    tools: [repository_read]
    mcps_optional: [context7, github]
  architecture-migration:
    mode: read_only
    inputs: [run_artifacts, repository_evidence]
    outputs: [architecture_migration]
    tools: [repository_read]
    mcps_optional: [context7, github]
  architecture-compliance-review:
    mode: read_only
    inputs: [run_artifacts, repository_evidence, changed_files, build_test, fixes]
    outputs: [findings]
    tools: [repository_read]
    mcps_optional: [context7, github]
  security:
    mode: read_only
    inputs: [request, acceptance_criteria, inspection]
    outputs: [findings]
    tools: [repository_read]
    mcps_optional: [context7]
  qa-plan:
    mode: read_only
    inputs: [acceptance_criteria, definition_of_done, inspection]
    outputs: [findings]
    tools: [repository_read]
    mcps_optional: [atlassian]
